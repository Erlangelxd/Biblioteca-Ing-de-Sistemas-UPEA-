{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block contenido %}
<div style="max-width:420px"><h1>{{ 'Modificar usuario' if u else 'Crear usuario' }}</h1>
<form method="post">{{ csrf() }}
{% if u %}<p><b>{{ u.nombre_usuario }}</b></p>{% else %}
<label>Nombre de usuario (3 a 30 caracteres)</label><input name="nombre_usuario" value="{{ f.get('nombre_usuario','') }}" required>{% endif %}
<label>Perfil</label><select name="rol">
<option value="consulta" {{ 'selected' if (u and u.rol=='consulta') or f.get('rol')=='consulta' }}>Consulta</option>
<option value="administrador" {{ 'selected' if (u and u.rol=='administrador') or f.get('rol')=='administrador' }}>Administrador (bibliotecaria)</option></select>
<label>{{ 'Contraseña nueva (déjela vacía para no cambiarla)' if u else 'Contraseña (mínimo 8 caracteres)' }}</label>
<input type="password" name="clave" {{ '' if u else 'required' }} minlength="8">
<button class="btn" type="submit">Guardar</button><a class="btn g" href="{{ url_for('auth.usuarios') }}">Cancelar</a>
</form></div>
{% endblock %}
