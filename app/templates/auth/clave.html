{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block contenido %}
<div style="max-width:380px"><h1>Cambiar contraseña</h1>
<form method="post">{{ csrf() }}
<label>Contraseña actual</label><input type="password" name="actual" required>
<label>Contraseña nueva (mínimo 8 caracteres)</label><input type="password" name="nueva" required minlength="8">
<label>Repetir contraseña nueva</label><input type="password" name="repetir" required minlength="8">
<button class="btn" type="submit">Guardar</button><a class="btn g" href="{{ url_for('main.inicio') }}">Cancelar</a>
</form></div>
{% endblock %}
