{% extends "base.html" %}
{% from "_macros.html" import csrf, icono with context %}
{% block titulo %}Cambiar contraseña — Biblioteca de Ingeniería de Sistemas{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6 col-xl-5">
    <div class="page-header">
      <div>
        <h1>Cambiar contraseña</h1>
        <p class="page-subtitle">Actualice la clave de acceso de su cuenta</p>
      </div>
    </div>
    <div class="card">
      <div class="card-body p-4">
        <form method="post">{{ csrf() }}
          <div class="mb-3">
            <label class="form-label" for="actual">Contraseña actual</label>
            <input class="form-control" type="password" name="actual" id="actual" required autocomplete="current-password">
          </div>
          <div class="mb-3">
            <label class="form-label" for="nueva">Contraseña nueva <span class="text-muted small">(mínimo 8 caracteres)</span></label>
            <input class="form-control" type="password" name="nueva" id="nueva" required minlength="8" autocomplete="new-password">
          </div>
          <div class="mb-4">
            <label class="form-label" for="repetir">Repetir contraseña nueva</label>
            <input class="form-control" type="password" name="repetir" id="repetir" required minlength="8" autocomplete="new-password">
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" type="submit">{{ icono('check') }} Guardar</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('main.inicio') }}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
