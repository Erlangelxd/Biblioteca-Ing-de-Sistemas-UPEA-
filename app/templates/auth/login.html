{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block contenido %}
<div style="max-width:380px;margin:30px auto">
<h1>Iniciar sesión</h1>
<form method="post">{{ csrf() }}
<label for="username">Usuario</label><input type="text" name="username" id="username" autofocus required autocomplete="username">
<label for="password">Contraseña</label><input type="password" name="password" id="password" required autocomplete="current-password">
<input type="hidden" name="next" value="{{ siguiente or '' }}">
<button class="btn" type="submit">Ingresar</button>
{% if config.CATALOGO_PUBLICO %}<a class="btn g" href="{{ url_for('main.catalogo') }}">Consultar el catálogo</a>{% endif %}
</form></div>
{% endblock %}
